name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Testes e build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: pytest --cov=src/calculadora --cov-report=term-missing

      - name: Build do pacote
        run: python -m build

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: dist-python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Nome local da imagem gerada pelo docker-compose.yml (serviços api e calculadora).
      APP_IMAGE: calculadora-notas:latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python (scripts de verificação)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes automáticos (docker-compose.test.yml)
        run: |
          docker compose -f docker-compose.test.yml up --build \
            --abort-on-container-exit --exit-code-from testes

      - name: Derrubar ambiente de testes
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Subir a stack (docker-compose.yml)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Teste de fumaça da API
        run: |
          curl -fsS -X POST http://localhost:8000/boletins \
            -H 'Content-Type: application/json' \
            -d '{"aluno": "Maria", "notas": [8, 7.5, 9]}' | tee resposta.json
          grep -q '"situacao":"Aprovado"' resposta.json
          curl -fsS http://localhost:8000/boletins | grep -q '"aluno": "Maria"'

      - name: Métricas da API (/metrics)
        run: |
          curl -fsS http://localhost:8000/metrics | tee metrics.txt | grep calculadora_ | head -20
          grep -q 'calculadora_boletins_total{situacao="Aprovado"}' metrics.txt

      - name: Monitoramento (Prometheus, Grafana e alertas)
        run: |
          docker compose --profile carga up -d trafego
          python scripts/verificar_monitoramento.py \
            --prometheus http://localhost:9090 --grafana http://localhost:3000

      - name: Teste de fumaça da CLI
        run: |
          docker compose run --rm calculadora --aluno "Maria" --notas 8 7.5 9 | tee saida.txt
          grep -q "Situação: Aprovado" saida.txt

      - name: Instalar Playwright (para os prints)
        continue-on-error: true
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Prints com a stack funcionando
        continue-on-error: true
        run: |
          sleep 120   # deixa o gerador de tráfego encher os gráficos
          python scripts/prints_grafana.py --saida prints/docker-compose

      - name: Alerta de ponta a ponta (derruba a API e espera o e-mail)
        run: |
          docker compose stop api
          python scripts/verificar_monitoramento.py --mailpit http://localhost:8025 \
            --esperar-alerta "API fora do ar" --timeout 240

      - name: Prints com o alerta disparado
        continue-on-error: true
        run: |
          python scripts/prints_grafana.py --saida prints/docker-compose --prefixo alerta- \
            --dashboards calculadora-api
          docker compose start api

      - name: Logs dos containers
        if: failure()
        run: docker compose logs

      - name: Publicar prints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-docker-compose
          path: prints/
          if-no-files-found: ignore

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

      - name: Publicar imagem no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag "$APP_IMAGE" "$IMAGE_LC:latest"
          docker tag "$APP_IMAGE" "$IMAGE_LC:${GITHUB_SHA::7}"
          docker push "$IMAGE_LC:latest"
          docker push "$IMAGE_LC:${GITHUB_SHA::7}"

  kubernetes:
    name: Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: ci

    env:
      IMAGE: ghcr.io/davi-barbara-carvalho/calculadora-notas

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python (scripts de verificação)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build da imagem
        run: docker build --target runtime -t "$IMAGE:ci" .

      - name: Criar cluster Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: calculadora

      - name: Carregar a imagem no cluster
        run: kind load docker-image "$IMAGE:ci" --name calculadora

      - name: Provisionar tudo (kubectl apply -k .)
        run: |
          # Mesmo comando do README, só trocando a tag da imagem pela que acabou de ser gerada.
          kubectl kustomize . | sed "s#$IMAGE:latest#$IMAGE:ci#g" | kubectl apply -f -
          sed "s#$IMAGE:latest#$IMAGE:ci#g" k8s/trafego.yaml | kubectl apply -f -

      - name: Esperar os Deployments
        run: |
          kubectl rollout status deployment/calculadora-db --timeout=180s
          kubectl rollout status deployment/calculadora-cache --timeout=180s
          kubectl rollout status deployment/calculadora-api --timeout=180s
          for d in prometheus kube-state-metrics mailpit grafana; do
            kubectl -n monitoramento rollout status deployment/$d --timeout=180s
          done
          kubectl get pods -A -o wide

      - name: Port-forward da API, Prometheus, Grafana e Mailpit
        run: |
          kubectl port-forward service/calculadora-api-service 8000:80 > /tmp/pf-api.log 2>&1 &
          kubectl -n monitoramento port-forward service/prometheus 9090:9090 > /tmp/pf-prom.log 2>&1 &
          kubectl -n monitoramento port-forward service/grafana 3000:3000 > /tmp/pf-grafana.log 2>&1 &
          kubectl -n monitoramento port-forward service/mailpit 8025:8025 > /tmp/pf-mailpit.log 2>&1 &
          sleep 5

      - name: Teste de fumaça da API
        run: |
          curl -fsS -X POST http://localhost:8000/boletins \
            -H 'Content-Type: application/json' \
            -d '{"aluno": "Maria", "notas": [8, 7.5, 9]}'
          curl -fsS http://localhost:8000/metrics | grep -q calculadora_boletins_total

      - name: Monitoramento (Prometheus, Grafana e alertas)
        run: |
          python scripts/verificar_monitoramento.py \
            --prometheus http://localhost:9090 \
            --jobs prometheus calculadora-api postgres redis cadvisor kube-state-metrics \
            --grafana http://localhost:3000 \
            --dashboards calculadora-api calculadora-containers kubernetes-cluster

      - name: Instalar Playwright (para os prints)
        continue-on-error: true
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Prints do cluster e do Grafana
        continue-on-error: true
        run: |
          mkdir -p prints/kubernetes
          sleep 120   # deixa o gerador de tráfego encher os gráficos
          { echo '$ kubectl get nodes,deployments,pods,services -A'
            kubectl get nodes,deployments,pods,services -A; } | tee prints/kubernetes/kubectl-get.txt
          { echo '$ kubectl -n default get deployments -o wide'
            kubectl -n default get deployments -o wide
            echo
            echo '$ kubectl rollout history deployment/calculadora-api'
            kubectl rollout history deployment/calculadora-api; } | tee prints/kubernetes/kubectl-deployments.txt
          python scripts/prints_grafana.py --saida prints/kubernetes \
            --dashboards calculadora-api calculadora-containers kubernetes-cluster \
            --terminal prints/kubernetes/kubectl-get.txt prints/kubernetes/kubectl-deployments.txt

      - name: Escalar e rolling update
        run: |
          kubectl scale deployment calculadora-api --replicas=3
          kubectl rollout status deployment/calculadora-api --timeout=120s
          kubectl rollout restart deployment/calculadora-api
          kubectl rollout status deployment/calculadora-api --timeout=180s
          kubectl rollout history deployment/calculadora-api

      - name: Alerta de ponta a ponta (API com 0 réplicas)
        run: |
          kubectl delete -f k8s/trafego.yaml
          kubectl scale deployment calculadora-api --replicas=0
          python scripts/verificar_monitoramento.py --mailpit http://localhost:8025 \
            --esperar-alerta "API fora do ar" --timeout 240

      - name: Prints com o alerta disparado
        continue-on-error: true
        run: |
          python scripts/prints_grafana.py --saida prints/kubernetes --prefixo alerta- \
            --dashboards calculadora-api kubernetes-cluster
          kubectl scale deployment calculadora-api --replicas=2

      - name: Publicar prints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-kubernetes
          path: prints/
          if-no-files-found: ignore

      - name: Diagnóstico
        if: failure()
        run: |
          kubectl get all -A -o wide
          kubectl describe pods
          kubectl -n monitoramento describe pods
          kubectl logs -l componente=api --all-containers --tail=100
          kubectl -n monitoramento logs deployment/grafana --tail=200
          kubectl -n monitoramento logs deployment/prometheus --tail=100
          cat /tmp/pf-*.log

  prints:
    name: Salvar prints no repositório
    runs-on: ubuntu-latest
    needs: [docker, kubernetes]
    # Só na main: guarda os prints gerados pelos jobs acima em docs/prints/.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar os prints
        uses: actions/download-artifact@v4
        with:
          pattern: prints-*
          merge-multiple: true
          path: docs/prints

      - name: Commit dos prints
        run: |
          ls -R docs/prints
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/prints
          # Push feito com o GITHUB_TOKEN não dispara o CI de novo.
          git diff --cached --quiet || git commit -m "docs: prints do Grafana e do cluster gerados pelo CI [skip ci]"
          git push
