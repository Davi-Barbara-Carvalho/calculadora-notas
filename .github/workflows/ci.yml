name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Testes e build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: pytest --cov=src/calculadora --cov-report=term-missing

      - name: Build do pacote
        run: python -m build

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: dist-python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem de testes
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: calculadora-notas:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Executar testes dentro do container
        run: docker run --rm calculadora-notas:test

      - name: Build da imagem final
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: calculadora-notas:latest
          load: true
          cache-from: type=gha

      - name: Teste de fumaça da imagem
        run: |
          docker run --rm calculadora-notas:latest --aluno "Maria" --notas 8 7.5 9 | tee saida.txt
          grep -q "Situação: Aprovado" saida.txt

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag calculadora-notas:latest "$IMAGE_LC:latest"
          docker tag calculadora-notas:latest "$IMAGE_LC:${GITHUB_SHA::7}"
          docker push "$IMAGE_LC:latest"
          docker push "$IMAGE_LC:${GITHUB_SHA::7}"
