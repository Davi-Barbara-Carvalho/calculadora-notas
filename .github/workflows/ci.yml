name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Testes e build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: pytest --cov=src/calculadora --cov-report=term-missing

      - name: Build do pacote
        run: python -m build

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: dist-python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Nome local da imagem gerada pelo docker-compose.yml (serviços api e calculadora).
      APP_IMAGE: calculadora-notas:latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Testes automáticos (docker-compose.test.yml)
        run: |
          docker compose -f docker-compose.test.yml up --build \
            --abort-on-container-exit --exit-code-from testes

      - name: Derrubar ambiente de testes
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Subir a stack (docker-compose.yml)
        run: docker compose up -d --build --wait

      - name: Teste de fumaça da API
        run: |
          curl -fsS -X POST http://localhost:8000/boletins \
            -H 'Content-Type: application/json' \
            -d '{"aluno": "Maria", "notas": [8, 7.5, 9]}' | tee resposta.json
          grep -q '"situacao":"Aprovado"' resposta.json
          curl -fsS http://localhost:8000/boletins | grep -q '"aluno": "Maria"'

      - name: Teste de fumaça da CLI
        run: |
          docker compose run --rm calculadora --aluno "Maria" --notas 8 7.5 9 | tee saida.txt
          grep -q "Situação: Aprovado" saida.txt

      - name: Logs dos containers
        if: failure()
        run: docker compose logs

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag "$APP_IMAGE" "$IMAGE_LC:latest"
          docker tag "$APP_IMAGE" "$IMAGE_LC:${GITHUB_SHA::7}"
          docker push "$IMAGE_LC:latest"
          docker push "$IMAGE_LC:${GITHUB_SHA::7}"
