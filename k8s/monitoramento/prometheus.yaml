# Prometheus no Kubernetes.
# A configuração (monitoring/prometheus/prometheus-k8s.yml) vira o ConfigMap
# "prometheus-config" pelo kustomization.yaml da raiz do repositório.
#
# Permissões (RBAC): o Prometheus consulta a API do Kubernetes para descobrir
# os Pods e lê as métricas do cAdvisor dos nós pelo proxy da API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoramento
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoramento
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoramento
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: dados
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # Dados temporários (somem se o Pod for recriado). Para guardar,
        # troque por um PersistentVolumeClaim como o do PostgreSQL.
        - name: dados
          emptyDir: {}
---
# Interface web: kubectl -n monitoramento port-forward svc/prometheus 9090:9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoramento
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
