# Grafana no Kubernetes: mesmos arquivos de provisionamento do Compose
# (fonte de dados, dashboards e alertas), entregues como ConfigMaps pelo
# kustomization.yaml da raiz do repositório.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoramento
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoramento
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-admin
          env:
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/calculadora/calculadora-api.json
            # Alertas por e-mail via Mailpit (troque para um SMTP real se quiser).
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: mailpit:1025
            - name: GF_SMTP_FROM_ADDRESS
              value: grafana@calculadora.local
            - name: GF_SMTP_FROM_NAME
              value: Grafana - Calculadora de Notas
            - name: GF_SMTP_SKIP_VERIFY
              value: "true"
            - name: ALERTA_EMAIL
              value: equipe@calculadora.local
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: dados
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
            - name: dashboards-calculadora
              mountPath: /var/lib/grafana/dashboards/calculadora
            - name: dashboards-kubernetes
              mountPath: /var/lib/grafana/dashboards/kubernetes
      volumes:
        - name: dados
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: alerting
          configMap:
            name: grafana-alerting
        - name: dashboards-calculadora
          configMap:
            name: grafana-dashboards-calculadora
        - name: dashboards-kubernetes
          configMap:
            name: grafana-dashboards-kubernetes
---
# Interface web: kubectl -n monitoramento port-forward svc/grafana 3000:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoramento
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30030
