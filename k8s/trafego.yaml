# Gerador de tráfego (opcional): faz requisições contínuas na API para os
# gráficos do Grafana terem dados.
#   kubectl apply -f k8s/trafego.yaml      # liga
#   kubectl delete -f k8s/trafego.yaml     # desliga
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-trafego
  labels:
    app: calculadora-notas
    componente: trafego
spec:
  replicas: 1
  selector:
    matchLabels:
      componente: trafego
  template:
    metadata:
      labels:
        app: calculadora-notas
        componente: trafego
    spec:
      containers:
        - name: trafego
          image: ghcr.io/davi-barbara-carvalho/calculadora-notas:latest
          command: ["python", "-m", "calculadora.trafego"]
          args: ["--url", "http://calculadora-api-service", "--rps", "5"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"
